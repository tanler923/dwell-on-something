<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -8.6 25.6 25.6" width="128" height="128"><style>.bd{transform-origin:7.5px 13px} .sh{transform-origin:7.5px 15.5px} .eye{transform-origin:7.5px 9px} .la{transform-origin:2px 10px} .ra{transform-origin:13px 10px} .ck{transform-origin:7.5px 6px} @keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}} @keyframes shd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.97)}} .bd{animation:muse 3.2s infinite ease-in-out} .sh{animation:shd 3.2s infinite ease-in-out} .eye{transform-origin:8px 8.5px;animation:blink 3.6s infinite} .ra{animation:ponder 1.4s infinite ease-in-out} .d1{animation:d1 2s infinite}.d2{animation:d2 2s infinite}.d3{animation:d3 2s infinite} @keyframes muse{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(-.3px)}} @keyframes ponder{0%,100%{transform:rotate(-60deg)}50%{transform:rotate(-42deg)}} @keyframes d1{0%,8%{opacity:0}18%,82%{opacity:1}92%,100%{opacity:0}} @keyframes d2{0%,28%{opacity:0}38%,82%{opacity:1}92%,100%{opacity:0}} @keyframes d3{0%,48%{opacity:0}58%,82%{opacity:1}92%,100%{opacity:0}}</style><rect class="sh" x="3" y="15" width="9" height="1" fill="#000" opacity=".35"/><g class="bd"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect class="la" x="0" y="9" width="2" height="2" fill="#DE886D"/><rect class="ra" x="13" y="9" width="2" height="2" fill="#DE886D"/><g class="eye" fill="#000"><rect x="4.5" y="7.5" width="1" height="2"/><rect x="10.5" y="7.5" width="1" height="2"/></g><g class="ck"><rect x="7.55" y="1.7" width=".6" height="1.2" rx=".3" fill="#E9B83E"/><rect x="5.5" y="2.5" width="4" height="3.6" rx="1.5" fill="#F7D460"/><rect x="5.6" y="4.5" width="1" height=".9" rx=".45" fill="#E9B83E"/><rect x="8.4" y="4.5" width="1" height=".9" rx=".45" fill="