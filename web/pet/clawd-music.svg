<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -8.6 25.6 25.6" width="128" height="128"><style>.bd{transform-origin:7.5px 13px} .sh{transform-origin:7.5px 15.5px} .eye{transform-origin:7.5px 9px} .la{transform-origin:2px 10px} .ra{transform-origin:13px 10px} .ck{transform-origin:7.5px 6px} @keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}} @keyframes shd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.97)}} .bd{animation:sway 1.2s infinite ease-in-out} .sh{animation:shd .6s infinite ease-in-out} .ck{animation:nod .6s infinite alternate ease-in-out} .nt{opacity:0;transform-box:fill-box;transform-origin:center;animation:nt 2.4s var(--d,0s) infinite ease-out} @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}} @keyframes nod{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}} @keyframes nt{0%{opacity:0;transform:translate(0,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(var(--tx,-2px),-7px) scale(1.1)}}</style><rect class="sh" x="3" y="15" width="9" height="1" fill="#000" opacity=".35"/><g class="bd"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect class="la" x="0" y="9" width="2" height="2" fill="#DE886D"/><rect class="ra" x="13" y="9" width="2" height="2" fill="#DE886D"/><path d="M2.2 9.2 A5.3 5.3 0 0 1 12.8 9.2" fill="none" stroke="#262b31" stroke-width=".9" stroke-linecap="round"/><rect x=".6" y="7.4" width="2.4" height="3.8" rx="1.2" fill="#262b31"/><rect x="12" y="7.4" width="2.4" height="3.8" rx="1.2" fill="#262b31"/><g fill="#000"><rect x="3.6" y="8.9" width="2" height=".6" rx=".3"/><rect x="9.4" y="8.9" width="2" height=".6" rx=".3"/></g><g fill="#f4a7a0" opacity=".9"><ellipse cx="4.6" cy="10.7" rx=".8" ry=".45"/><ellipse cx="10.4" cy="10.7" rx=".8" ry=".45"/></g><g class="ck"><rect x="7.55" y="1.7" width=".6" height="1.2" rx=".3" fill="#E9B83E"/><rect x="5.5" y="2.5" width="4" height="3.6" rx="1.5" fill="#F7D460"/><rect x="5.6" y="4.5" width="1" height=".9" rx=".45" fill="#E9B83E"/><rect x="8.4" y="4.5" width="1" height=".9" rx=".45" fill="#E9B83E"/><rect x="6.45" y="3.5" width=".5" height=".7" fill="#000"/><rect x="8.05" y="3.5" width=".5" height=".7" fill="#000"/><rect x="7.1" y="4.3" width=".8" height=".5" rx=".2" fill="#EF8D3C"/></g></g><g fill="#8fa8d6" font-family="sans-serif" font-weight="bold"><text class="nt" style="--d:0s;--tx:-2px" x="-3.6" y="5.5" font-size="3.6">♪</text><text class="nt" style="--d:-1.2s;--tx:2px" x="15.2" y="4" font-size="3.6">♫</text></g></svg>
