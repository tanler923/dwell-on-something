<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -8.6 25.6 25.6" width="128" height="128"><style>.bd{transform-origin:7.5px 13px} .sh{transform-origin:7.5px 15.5px} .eye{transform-origin:7.5px 9px} .la{transform-origin:2px 10px} .ra{transform-origin:13px 10px} .ck{transform-origin:7.5px 6px} @keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}} @keyframes shd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.97)}} .bd{animation:bob 2.6s infinite ease-in-out} .sh{animation:shd 2.6s infinite ease-in-out} .eye{animation:blink 3.2s infinite} .ck{animation:peep 5.2s infinite ease-in-out} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.4px)}} @keyframes peep{0%,40%,100%{transform:rotate(0)}50%,70%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}</style><rect class="sh" x="3" y="15" width="9" height="1" fill="#000" opacity=".35"/><g class="bd"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect class="la" x="0" y="9" width="2" height="2" fill="#DE886D"/><rect class="ra" x="13" y="9" width="2" height="2" fill="#DE886D"/><g class="eye" fill="#000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g><g class="ck"><rect x="7.55" y="1.7" width=".6" height="1.2" rx=".3" fill="#E9B83E"/><rect x="5.5" y="2.5" width="4" height="3.6" rx="1.5" fill="#F7D460"/><rect x="5.6" y="4.5" width="1" height=".9" rx=".45" fill="#E9B83E"/><rect x="8.4" y="4.5" width="1" height=".9" rx=".45" fill="#E9B83E"/><rect x="6.45" y="3.5" width=".5" height=".7" fill="#000"/><rect x="8.05" y="3.5" width=".5" height=".7" fill="#000"/><rect x="7.1" y="4.3" width=".8" height=".5" rx=".2" fill="#EF8D3C"/></g></g></svg>
