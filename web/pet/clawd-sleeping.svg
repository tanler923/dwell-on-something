<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -8.6 25.6 25.6" width="128" height="128"><style>.bd{transform-origin:7.5px 13px} .sh{transform-origin:7.5px 15.5px} .eye{transform-origin:7.5px 9px} .la{transform-origin:2px 10px} .ra{transform-origin:13px 10px} .ck{transform-origin:7.5px 6px} @keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}} @keyframes shd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.97)}} .bd{animation:breathe 3.6s infinite ease-in-out} .sh{animation:sshd 3.6s infinite ease-in-out} .la,.ra{transform:translateY(.7px)} .ck{transform:rotate(-10deg)} .bub{transform-origin:12.4px 10.2px;animation:bub 3.6s infinite ease-in-out} .z{opacity:0;transform-box:fill-box;transform-origin:center;animation:zz 3s var(--d,0s) infinite ease-out} @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(.5px) scaleY(.96)}} @keyframes sshd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.03)}} @keyframes bub{0%,60%,100%{transform:scale(.2);opacity:0}30%{transform:scale(1);opacity:.75}} @keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translate(var(--tx,4px),-7px) scale(1.2)}}</style><rect class="sh" x="3" y="15" width="9" height="1" fill="#000" opacity=".35"/><g class="bd"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect class="la" x="0" y="9" width="2" height="2" fill="#DE886D"/><rect class="ra" x="13" y="9" width="2" height="2" fill="#DE886D"/><g fill="#000"><rect x="3.6" y="8.9" width="2" height=".7" rx=".35"/><rect x="9.4" y="8.9" width="2" height=".7" rx=".35"/></g><circle class="bub" cx="12.4" cy="10.2" r="1.1" fill="#cfe0ff"/><g class="ck"><rect x="7.55" y="1.7" width=".6" height="1.2" rx=".3" fill="#E9B83E"/><rect x="5.5" y="2.5" width="4" height="3.6" rx="1.5" fill="#F7D460"/><rect x="5.6" y="4.5" width="1" height=".9" rx=".45" fill="#E9B83E"/><rect x="8.4" y="4.5" width="1" height=".9" rx=".45" fill="#E9B83E"/><rect x="6.3" y="3.85" width=".8" height=".3" rx=".15" fill="#000"/><rect x="7.9" y="3.85" width=".8" height=".3" rx=".15" fill="#000"/><rect x="7.1" y="4.3" width=".8" height=".5" rx=".2" fill="#EF8D3C"/></g></g><g fill="#8fa8d6" font-family="monospace" font-weight="bold"><text class="z" style="--d:0s;--tx:4px" x="11.5" y="4" font-size="2.6">Z</text><text class="z" style="--d:-1s;--tx:3.5px" x="13.5" y="1" font-size="3.4">Z</text><text class="z" style="--d:-2s;--tx:3px" x="15.5" y="-2.5" font-size="4.2">Z</text></g></svg>
